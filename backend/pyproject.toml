[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxqa"
version = "0.1.0"
description = "Citation-grounded question answering over the Income-tax Act, 1961 (backend)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["taxqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
